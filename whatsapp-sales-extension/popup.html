<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1">
<title>Settings - AI Sales Copilot</title>
<style>
:root {
  --bg: #111b21;
  --panel: #182229;
  --field: #202c33;
  --line: #2a3942;
  --muted: #8696a0;
  --text: #e9edef;
  --accent: #00a884;
  --accent-strong: #00c49a;
  --danger: #ff6b6b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 360px;
  min-height: 420px;
  max-height: 600px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.shell {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 600px;
  max-height: 100vh;
}

.header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--line);
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

h1 {
  color: var(--accent);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.badge {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}

.panel-btn {
  width: 100%;
  min-height: 38px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  background: var(--accent);
  color: #111b21;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
}

.panel-btn:hover { background: var(--accent-strong); }

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.tab {
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  background: var(--panel);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
}

.tab[aria-selected="true"] {
  color: var(--text);
  border-color: rgba(0, 168, 132, .65);
  background: rgba(0, 168, 132, .14);
}

.content {
  overflow-y: auto;
  padding: 12px 14px 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

.section { display: none; }
.section.active { display: block; }

.section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

h2 {
  color: var(--text);
  font-size: 14px;
  line-height: 1.25;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  margin-top: 3px;
}

.field { margin-bottom: 10px; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}

input,
select {
  width: 100%;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 7px;
  outline: none;
  background: var(--field);
  color: var(--text);
  padding: 7px 9px;
  font: inherit;
  font-size: 13px;
}

input:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(0, 168, 132, .16);
}

.switch-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}

.switch-copy strong {
  display: block;
  font-size: 13px;
  color: var(--text);
  margin-bottom: 3px;
}

.switch-copy span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.switch {
  position: relative;
  flex: 0 0 auto;
  width: 42px;
  height: 24px;
}

.switch input {
  position: absolute;
  opacity: 0;
  inset: 0;
}

.slider {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: #3a4952;
  cursor: pointer;
  transition: background .16s ease;
}

.slider::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: transform .16s ease;
}

.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::after { transform: translateX(18px); }

.actions {
  padding: 10px 14px 12px;
  background: var(--bg);
  border-top: 1px solid var(--line);
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn {
  min-height: 36px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
}

.btn-primary {
  background: var(--accent);
  color: #111b21;
}

.btn-primary:hover { background: var(--accent-strong); }

.btn-secondary {
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--line);
}

.btn-secondary:hover { background: #2a3942; }

.btn:disabled {
  cursor: default;
  opacity: .6;
}

#status {
  min-height: 20px;
  margin-top: 8px;
  padding: 0 2px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  text-align: center;
}

#status.success { color: var(--accent); }
#status.error { color: var(--danger); }
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="title-row">
      <h1>AI Sales Copilot</h1>
      <span class="badge">B2B translate</span>
    </div>
    <button class="panel-btn" id="openPanelBtn" type="button">Open Side Panel</button>
  </header>

  <nav class="tabs" aria-label="Settings sections">
    <button class="tab" id="tab-ai" type="button" role="tab" aria-controls="section-ai" aria-selected="true">AI</button>
    <button class="tab" id="tab-language" type="button" role="tab" aria-controls="section-language" aria-selected="false">Language</button>
    <button class="tab" id="tab-behavior" type="button" role="tab" aria-controls="section-behavior" aria-selected="false">Behavior</button>
  </nav>

  <section class="content">
    <div class="section active" id="section-ai" role="tabpanel" aria-labelledby="tab-ai">
      <div class="section-head">
        <div>
          <h2>AI Provider</h2>
          <p class="hint">Connect an OpenAI-compatible service.</p>
        </div>
      </div>
      <div class="field">
        <label for="llmBaseURL">Base URL</label>
        <input type="text" id="llmBaseURL" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      </div>
      <div class="field">
        <label for="llmApiKey">API Key</label>
        <input type="password" id="llmApiKey" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="field">
        <label for="llmModel">Model</label>
        <input type="text" id="llmModel" placeholder="deepseek-chat" autocomplete="off">
      </div>
    </div>

    <div class="section" id="section-language" role="tabpanel" aria-labelledby="tab-language" hidden>
      <div class="section-head">
        <div>
          <h2>Translation</h2>
          <p class="hint">Set the seller and customer languages.</p>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="userNativeLang">Your Language</label>
          <select id="userNativeLang">
            <option value="zh">Chinese</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="ar">Arabic</option>
            <option value="pt">Portuguese</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="id">Indonesian</option>
            <option value="vi">Vietnamese</option>
            <option value="th">Thai</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="it">Italian</option>
          </select>
        </div>
        <div class="field">
          <label for="customerLang">Customer</label>
          <select id="customerLang">
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="es">Spanish</option>
            <option value="ar">Arabic</option>
            <option value="pt">Portuguese</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="id">Indonesian</option>
            <option value="vi">Vietnamese</option>
            <option value="th">Thai</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="it">Italian</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="contextWindow">Context Window</label>
        <input type="number" id="contextWindow" min="5" max="30" value="10">
      </div>
    </div>

    <div class="section" id="section-behavior" role="tabpanel" aria-labelledby="tab-behavior" hidden>
      <div class="section-head">
        <div>
          <h2>Opening Behavior</h2>
          <p class="hint">Control how the assistant appears on WhatsApp Web.</p>
        </div>
      </div>
      <label class="switch-card" for="autoOpenSidePanel">
        <span class="switch-copy">
          <strong>Auto-open side panel</strong>
          <span>Open the assistant automatically when WhatsApp Web loads.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="autoOpenSidePanel" checked>
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
    </div>
  </section>

  <footer class="actions">
    <div class="action-row">
      <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
      <button class="btn btn-secondary" id="testBtn" type="button">Test LLM</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </footer>
</main>

<script src="popup.js"></script>
</body>
</html>
